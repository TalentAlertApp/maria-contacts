<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Contacts Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__content">
            <div class="header__left">
                <div class="header__logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                    <span class="header__title">Contacts Manager</span>
                </div>
            </div>
            
            <div class="header__center">
                <div class="search-container">
                    <input type="text" id="globalSearch" class="form-control search-input" placeholder="Search contacts..." aria-label="Search contacts">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
            </div>
            
            <div class="header__right">
                <button class="btn btn--outline btn--sm" id="importBtn" title="Import CSV">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7,10 12,15 17,10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button class="btn btn--outline btn--sm" id="exportBtn" title="Export CSV">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17,8 12,3 7,8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
                <button class="btn btn--outline btn--sm" id="exportPdfBtn" title="Export to PDF">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14,2 14,8 20,8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10,9 9,9 8,9"></polyline>
                    </svg>
                </button>
                <button class="btn btn--outline btn--sm" id="clearAllContactsBtn" title="Clear All Contacts">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M3 12h18M3 18h18"></path>
                    </svg>
                </button>
                <button class="btn btn--primary btn--sm" id="addContactBtn">Add Contact</button>
                <button class="btn btn--outline btn--sm theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="main__container">
            <!-- Sidebar removed - no more filters -->

            <!-- Content Area -->
            <div class="content">
                <div class="content__header">
                    <div class="content__stats">
                        <span id="contactCount">0 contacts</span>
                        <span id="filteredCount" class="hidden">0 filtered</span>
                        
                        <!-- Records per page moved here -->
                        <div class="records-per-page">
                            <label for="tableRecordsPerPage">Records per page:</label>
                            <select id="tableRecordsPerPage" class="form-control">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="content__controls">
                        <div class="view-toggle">
                            <button class="view-toggle__btn active" data-view="table" aria-label="Table view">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18M3 12h18M3 18h18"></path>
                                </svg>
                            </button>
                            <button class="view-toggle__btn" data-view="cards" aria-label="Card view">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                            </button>
                        </div>
                        
                        <button id="favoritesFilter" class="btn btn--outline btn--sm" title="Show favorites only">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </button>
                    </div>
                </div>





                <!-- Table View -->
                <div id="tableView" class="table-container">
                    <table class="contacts-table">
                                                    <thead>
                                <tr>
                                    <th class="sortable" data-sort="id">ID</th>
                                    <th class="sortable" data-sort="linkedin">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                                        </svg>
                                    </th>
                                    <th class="sortable" data-sort="name">Name</th>
                                <th class="sortable" data-sort="company">Company</th>
                                <th class="sortable" data-sort="position">Position</th>
                                <th class="sortable" data-sort="industry">Industry</th>
                                <th class="sortable" data-sort="location">Location</th>
                                <th class="sortable" data-sort="priority">Priority</th>
                                <th class="sortable" data-sort="status">Status</th>
                                <th class="sortable" data-sort="relationship">Relationship</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contactsTableBody">
                        </tbody>
                    </table>
                    
                    <!-- Table Pagination -->
                    <div id="tablePaginationContainer" class="table-pagination hidden">
                        <button id="tablePrevPageBtn" class="btn btn--outline btn--sm">Previous</button>
                        <div id="tablePageInfo" class="table-pagination__info">Page 1 of 1</div>
                        <button id="tableNextPageBtn" class="btn btn--outline btn--sm">Next</button>
                    </div>
                </div>

                <!-- Card View -->
                <div id="cardView" class="cards-container hidden">
                    <div id="contactsCardsContainer" class="cards-grid">
                    </div>
                    
                    <!-- Pagination -->
                    <div id="paginationContainer" class="pagination hidden">
                        <button id="prevPageBtn" class="btn btn--outline btn--sm">Previous</button>
                        <div id="pageInfo" class="pagination__info">Page 1 of 1</div>
                        <button id="nextPageBtn" class="btn btn--outline btn--sm">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Contact Modal -->
    <div id="contactModal" class="modal hidden" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal__backdrop"></div>
        <div class="modal__content">
            <div class="modal__header">
                <h2 id="modalTitle">Add Contact</h2>
                <button class="modal__close" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="modal__tabs">
                <button class="modal__tab active" data-tab="basic">Basic Info</button>
                <button class="modal__tab" data-tab="professional">Professional</button>
                <button class="modal__tab" data-tab="contact">Contact Details</button>
                <button class="modal__tab" data-tab="additional">Additional</button>
            </div>
            
            <form id="contactForm" class="modal__body">
                <!-- Basic Info Tab -->
                <div class="modal__tab-content active" data-tab="basic">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contactName">Name *</label>
                            <input type="text" id="contactName" class="form-control" required>
                            <div class="form-error" id="nameError"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contactEmail">Email</label>
                            <input type="email" id="contactEmail" class="form-control">
                            <div class="form-error" id="emailError"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contactCompany">Company</label>
                            <input type="text" id="contactCompany" class="form-control" list="contactCompanyOptions" placeholder="Type or select company">
                            <datalist id="contactCompanyOptions">
                                <option value="">Select Company</option>
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contactPosition">Position</label>
                            <input type="text" id="contactPosition" class="form-control">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" id="contactFavorite"> Mark as favorite
                        </label>
                    </div>
                </div>
                
                <!-- Professional Tab -->
                <div class="modal__tab-content" data-tab="professional">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contactIndustry">Industry</label>
                            <input type="text" id="contactIndustry" class="form-control" list="contactIndustryOptions" placeholder="Type or select industry">
                            <datalist id="contactIndustryOptions">
                                <option value="">Select Industry</option>
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contactLocation">Location</label>
                            <input type="text" id="contactLocation" class="form-control" list="contactLocationOptions" placeholder="Type or select location">
                            <datalist id="contactLocationOptions">
                                <option value="">Select Location</option>
                            </datalist>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contactPriority">Priority</label>
                            <select id="contactPriority" class="form-control">
                                <option value="">Select Priority</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contactStatus">Status</label>
                            <select id="contactStatus" class="form-control">
                                <option value="">Select Status</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Contact Details Tab -->
                <div class="modal__tab-content" data-tab="contact">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contactRelationship">Relationship</label>
                            <select id="contactRelationship" class="form-control" style="width: 150px;">
                                <option value="">Select Relationship</option>
                                <option value="Good friend">Good friend</option>
                                <option value="Acquainted">Acquainted</option>
                                <option value="None">None</option>
                                <option value="No idea">No idea</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contactCity">City</label>
                            <input type="text" id="contactCity" class="form-control" list="contactCityOptions" placeholder="Type or select city">
                            <datalist id="contactCityOptions">
                                <option value="">Select City</option>
                            </datalist>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="contactLinkedin">LinkedIn URL</label>
                            <input type="url" id="contactLinkedin" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="contactOther">Other Contact Info</label>
                            <input type="text" id="contactOther" class="form-control">
                        </div>
                    </div>
                </div>
                
                <!-- Additional Tab -->
                <div class="modal__tab-content" data-tab="additional">
                    <div class="form-group">
                        <label class="form-label" for="contactSkills">Skills</label>
                        <input type="text" id="contactSkills" class="form-control" placeholder="Comma-separated skills">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="contactInterests">Interests</label>
                        <input type="text" id="contactInterests" class="form-control" placeholder="Comma-separated interests">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="contactNotes">Notes</label>
                        <textarea id="contactNotes" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </form>
            
            <div class="modal__footer">
                <button type="button" class="btn btn--outline" id="cancelBtn">Cancel</button>
                <button type="submit" form="contactForm" class="btn btn--primary" id="saveBtn">Save Contact</button>
            </div>
        </div>
    </div>

    <!-- Import CSV Modal -->
    <div id="importModal" class="modal hidden" role="dialog" aria-labelledby="importModalTitle" aria-hidden="true">
        <div class="modal__backdrop"></div>
        <div class="modal__content">
            <div class="modal__header">
                <h2 id="importModalTitle">Import Contacts</h2>
                <button class="modal__close" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="modal__body">
                <div class="file-upload">
                    <input type="file" id="csvFileInput" accept=".csv" class="file-input" aria-label="Select CSV file">
                    <label for="csvFileInput" class="file-upload__label">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7,10 12,15 17,10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Choose CSV file or drag and drop</span>
                    </label>
                </div>
                <div class="import-options">
                    <h5>Import Options:</h5>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="radio" name="importMode" value="add" checked>
                            <span>Add new contacts only (skip duplicates)</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="radio" name="importMode" value="replace">
                            <span>Replace all existing contacts</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="radio" name="importMode" value="merge">
                            <span>Merge and update existing contacts</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="modal__footer">
                <button type="button" class="btn btn--outline" id="cancelImportBtn">Cancel</button>
                <button type="button" class="btn btn--primary" id="confirmImportBtn" disabled>Import Contacts</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="alert" aria-live="polite">
        <div class="toast__content">
            <span id="toastMessage"></span>
            <button class="toast__close" aria-label="Close notification">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Hidden CSV file input for export -->
    <input type="file" id="hiddenFileInput" style="display: none;" accept=".csv">

    <script src="app.js"></script>
</body>
</html>
